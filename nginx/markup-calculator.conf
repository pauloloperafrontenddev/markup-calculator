# ────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — Markup Calculator
#
# DEV:  proxies localhost:80 → Vite dev server on :3000
# PROD: proxies localhost:80 → Node/TanStack Start server on :3000
#       (also add SSL block below for production with certbot)
#
# Install:
#   sudo apt install nginx
#   sudo cp nginx/markup-calculator.conf /etc/nginx/sites-available/markup-calculator
#   sudo ln -s /etc/nginx/sites-available/markup-calculator /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ────────────────────────────────────────────────────────────────────────────

upstream app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name localhost;          # Replace with your domain in production
                                    # e.g. server_name quotes.example.com;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy    "geolocation=(), camera=(), microphone=()" always;
    # CSP: adjust 'connect-src' once you know your Supabase project URL
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob: https://*.supabase.co; \
         connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321;"
        always;

    # ── Proxy to app ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://app;
        proxy_http_version 1.1;

        # Required for WebSockets (Vite HMR in dev, Supabase Realtime)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    86400s;   # keep long-lived WebSocket connections open
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        proxy_buffering off;            # stream responses (SSR, streaming)
        proxy_cache_bypass $http_upgrade;
    }

    # ── Static asset caching (production build only) ──────────────────────
    # Vite hashes asset filenames, so we can cache them aggressively.
    location ~* ^/assets/ {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Supabase local dev API passthrough (remove in production) ─────────
    # Routes /supabase-api/* → Supabase local REST API on :54321
    # Useful if you want to call Supabase directly via a single origin in dev.
    location /supabase-api/ {
        rewrite ^/supabase-api/(.*) /$1 break;
        proxy_pass         http://127.0.0.1:54321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

