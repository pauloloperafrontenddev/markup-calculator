# ────────────────────────────────────────────────────────────────────────────
# Nginx — Docker development config
# Used by docker-compose.yml (service: nginx)
# Upstream is the Docker service name "app", not localhost.
# ────────────────────────────────────────────────────────────────────────────

upstream app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # ── Proxy to Vite dev server ──────────────────────────────────────────
    location / {
        proxy_pass         http://app;
        proxy_http_version 1.1;

        # WebSocket support — required for Vite HMR and Supabase Realtime
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for HMR and streaming responses
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        proxy_buffering    off;
        proxy_cache_bypass $http_upgrade;
    }
}
